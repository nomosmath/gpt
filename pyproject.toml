[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nomosmath-gpt"
version = "0.1.0"
description = "A small, typed Python foundation for GPT-related tools."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "nomosmath" }]
dependencies = []

[project.scripts]
gpt = "gpt.cli:main"

[dependency-groups]
dev = [
  "pyright>=1.1.400,<2",
  "pytest>=8.4,<9",
  "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gpt"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
